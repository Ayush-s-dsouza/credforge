[project]
name = "credforge"
version = "0.1.0"
description = "CLI agent that automates developer-credential acquisition research for SaaS integrations."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.7",
    "tldextract>=5.1",
    "ddgs>=9.0",
]

[project.optional-dependencies]
live = ["playwright>=1.44"]
llm = ["anthropic>=0.28"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "time-machine>=2.14",
    "respx>=0.21",
    "anthropic>=0.28",
]

[project.scripts]
credforge = "credforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
